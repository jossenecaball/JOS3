<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>


<style>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #dcdcd9;
}


/* =====================================================
   WEB REAL
===================================================== */

.pagina {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 40%,
            #ffffff 0%,
            #e3e3e1 45%,
            #c4c4c1 100%
        );

    color: #111;

    transform: scale(1.02);

    transition:
        transform 1.5s
        cubic-bezier(.16,1,.3,1);
}


/* Brillos de fondo */

.pagina::before {

    content: "";

    position: absolute;

    inset: -20%;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.9),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(255,255,255,.5),
            transparent 35%
        );

    pointer-events: none;
}


/* =====================================================
   CONTENIDO DE LA WEB
===================================================== */

.contenido-web {

    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    z-index: 2;
}


.titulo-web {

    font-size:
        clamp(100px, 17vw, 260px);

    font-weight: 900;

    letter-spacing: -15px;

    color: #111;

    line-height: .8;
}


.subtitulo-web {

    margin-top: 35px;

    font-size: 13px;

    letter-spacing: 9px;

    color: #555;

    text-transform: uppercase;
}


/* =====================================================
   PANTALLA DE ENTRADA
===================================================== */

.entrada {

    position: fixed;

    inset: 0;

    z-index: 10;

    /*
       La parte gris está encima de la web.
       La zona alrededor del ratón será transparente.
    */

    background:

        radial-gradient(
            circle 170px at var(--mouse-x) var(--mouse-y),

            rgba(255,255,255,0) 0%,

            rgba(255,255,255,0) 65%,

            rgba(225,225,222,.30) 76%,

            rgba(225,225,222,.88) 100%
        );

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    cursor: none;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}


/* =====================================================
   CAPA GRIS GENERAL
===================================================== */

.entrada::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle 170px at var(--mouse-x) var(--mouse-y),

            rgba(230,230,227,0) 0%,

            rgba(230,230,227,.08) 55%,

            rgba(230,230,227,.72) 100%
        );

    pointer-events: none;
}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.logo-central {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(520px, 55vw);

    z-index: 30;

    pointer-events: none;

    user-select: none;

    transition:

        transform 1.2s
        cubic-bezier(.16,1,.3,1),

        opacity 1s ease;
}


.logo-central img {

    width: 100%;

    height: auto;

    display: block;

    filter:

        drop-shadow(
            0 25px 35px
            rgba(0,0,0,.20)
        );
}


/* =====================================================
   BORDE DE LA LENTE
===================================================== */

.lente {

    position: fixed;

    left: 0;
    top: 0;

    width: 340px;
    height: 340px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;

    z-index: 25;

    opacity: 0;

    border:

        1px solid
        rgba(255,255,255,.85);

    box-shadow:

        0 0 25px
        rgba(255,255,255,.5),

        0 15px 50px
        rgba(0,0,0,.12),

        inset 0 0 30px
        rgba(255,255,255,.25);

    transition:
        opacity .4s ease;
}


/* Reflejo de cristal */

.lente::before {

    content: "";

    position: absolute;

    width: 55%;
    height: 55%;

    top: -10%;
    left: -10%;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.65),
            transparent 65%
        );

    filter: blur(10px);
}


/* =====================================================
   AL HACER CLICK
===================================================== */

.entrada.expandir {

    animation:

        expandirEntrada
        1.5s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


@keyframes expandirEntrada {

    0% {

        clip-path:

            circle(
                170px
                at var(--mouse-x)
                var(--mouse-y)
            );

        opacity: 1;
    }

    100% {

        clip-path:

            circle(
                150vmax
                at var(--mouse-x)
                var(--mouse-y)
            );

        opacity: 0;
    }
}


/* =====================================================
   LOGO AL ENTRAR
===================================================== */

.entrada.expandir
.logo-central {

    transform:

        translate(-50%, -50%)
        scale(.65);

    opacity: 0;
}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 700px) {

    .logo-central {

        width: 75vw;
    }

    .lente {

        width: 230px;
        height: 230px;
    }

    .titulo-web {

        font-size: 25vw;

        letter-spacing: -5px;
    }

    .subtitulo-web {

        font-size: 9px;

        letter-spacing: 5px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     WEB REAL
===================================================== -->

<main class="pagina">

    <div class="contenido-web">

        <div class="titulo-web">
            JOS3
        </div>

        <div class="subtitulo-web">
            Página personal
        </div>

    </div>

</main>


<!-- =====================================================
     PANTALLA DE ENTRADA
===================================================== -->

<section
    class="entrada"
    id="entrada"
>


    <!-- LENTE -->

    <div
        class="lente"
        id="lente"
    ></div>


    <!-- LOGO -->

    <div class="logo-central">

        <img
            src="logo-secundario.png"
            alt="JOS3"
        >

    </div>


</section>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const entrada =
    document.getElementById("entrada");

const lente =
    document.getElementById("lente");


/* =====================================================
   POSICIÓN DEL RATÓN
===================================================== */

let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;


let actualX =
    mouseX;

let actualY =
    mouseY;


/* =====================================================
   MOVIMIENTO DEL RATÓN
===================================================== */

document.addEventListener(
    "mousemove",
    function(evento) {

        mouseX =
            evento.clientX;

        mouseY =
            evento.clientY;

        lente.style.opacity = "1";

    }
);


/* =====================================================
   MOVIMIENTO SUAVE
===================================================== */

function animar() {

    actualX +=
        (mouseX - actualX) * 0.12;

    actualY +=
        (mouseY - actualY) * 0.12;


    /*
       Movemos la lente
    */

    lente.style.left =
        actualX + "px";

    lente.style.top =
        actualY + "px";


    /*
       Estas variables controlan
       el agujero de la pantalla gris.
    */

    entrada.style.setProperty(
        "--mouse-x",
        actualX + "px"
    );

    entrada.style.setProperty(
        "--mouse-y",
        actualY + "px"
    );


    requestAnimationFrame(animar);
}


animar();


/* =====================================================
   ENTRAR EN LA WEB
===================================================== */

entrada.addEventListener(
    "click",
    function() {

        entrada.classList.add(
            "expandir"
        );

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.key === "Enter" ||
            evento.key === " "
        ) {

            entrada.click();

        }

    }
);

</script>


</body>

</html>
