<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PÁGINA REAL
===================================================== */

.pagina {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 40%,
            #f2f2f2 0%,
            #d2d2d2 45%,
            #a8a8a8 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    color: #111;
}


.contenido {

    text-align: center;

}


.contenido h1 {

    font-size:
        clamp(
            100px,
            18vw,
            260px
        );

    font-weight: 900;

    letter-spacing: -12px;

}


.contenido p {

    margin-top: 10px;

    font-size: 18px;

    letter-spacing: 6px;

    opacity: .5;

}


/* =====================================================
   NIEBLA / SALVAPANTALLAS
===================================================== */

#niebla {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 20;

    pointer-events: none;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    position: fixed;

    z-index: 30;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            300px,
            45vw
        );

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(
                0,
                0,
                0,
                .18
            )
        );

    transition:

        opacity .6s ease,

        transform .8s ease;
}


/* =====================================================
   CAPA DE NIEBLA BASE
===================================================== */

.capa-niebla {

    position: fixed;

    inset: 0;

    z-index: 10;

    background:

        radial-gradient(
            ellipse at center,
            rgba(
                250,
                250,
                250,
                .72
            ),

            rgba(
                225,
                225,
                225,
                .86
            ),

            rgba(
                205,
                205,
                205,
                .94
            )
        );

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    pointer-events: none;

}


/* =====================================================
   TRANSICIÓN FINAL
===================================================== */

.capa-niebla.salir {

    opacity: 0;

    transition:
        opacity 1.1s ease;
}


#niebla.salir {

    opacity: 0;

    transition:
        opacity .8s ease;
}


.logo.salir {

    opacity: 0;

    transform:

        translate(
            -50%,
            -50%
        )

        scale(1.25);
}


</style>

</head>


<body>


<!-- =====================================================
     PÁGINA QUE ESTÁ DEBAJO
===================================================== -->

<div class="pagina">

    <div class="contenido">

        <h1>JOS3</h1>

        <p>PÁGINA PERSONAL</p>

    </div>

</div>


<!-- =====================================================
     NIEBLA BASE
===================================================== -->

<div
    class="capa-niebla"
    id="capaNiebla">
</div>


<!-- =====================================================
     CANVAS PARA EL EFECTO PINCEL
===================================================== -->

<canvas
    id="niebla">
</canvas>


<!-- =====================================================
     LOGO CENTRAL
===================================================== -->

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "niebla"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let ancho;

let alto;


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function ajustarCanvas() {

    ancho =
        window.innerWidth;

    alto =
        window.innerHeight;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        ancho * dpr;


    canvas.height =
        alto * dpr;


    canvas.style.width =
        ancho + "px";


    canvas.style.height =
        alto + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


/* =====================================================
   RATÓN
===================================================== */

let raton = {

    x: ancho / 2,

    y: alto / 2

};


let ultimoX =
    raton.x;


let ultimoY =
    raton.y;


/* =====================================================
   PINCELADAS
===================================================== */

let pinceladas = [];


/*
   Cada pincelada tiene:

   x
   y
   tamaño
   rotación
   vida
   velocidad
*/


document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            event.clientX;

        const y =
            event.clientY;


        /*
           Distancia recorrida
        */

        const dx =
            x - ultimoX;

        const dy =
            y - ultimoY;


        const distancia =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           Creamos varios puntos
           dependiendo de la velocidad.
        */

        const cantidad =
            Math.max(
                1,
                Math.floor(
                    distancia / 8
                )
            );


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const porcentaje =
                i / cantidad;


            const px =
                ultimoX +
                dx * porcentaje;


            const py =
                ultimoY +
                dy * porcentaje;


            pinceladas.push({

                x: px,

                y: py,

                /*
                   Tamaño pequeño
                   y ligeramente irregular
                */

                ancho:
                    35 +
                    Math.random() * 30,

                alto:
                    20 +
                    Math.random() * 22,

                /*
                   Rotación siguiendo
                   aproximadamente el movimiento
                */

                angulo:
                    Math.atan2(
                        dy,
                        dx
                    ) +
                    (
                        Math.random() - .5
                    ) * .7,

                /*
                   Vida inicial
                */

                vida: 1,

                /*
                   Velocidad de desaparición
                */

                velocidad:
                    .018 +
                    Math.random() * .012

            });

        }


        ultimoX = x;

        ultimoY = y;

        raton.x = x;

        raton.y = y;

    }
);


/* =====================================================
   DIBUJAR PINCELADAS
===================================================== */

function dibujar() {


    /*
       Limpiamos el canvas.
    */

    ctx.clearRect(
        0,
        0,
        ancho,
        alto
    );


    /*
       Recorremos las pinceladas
    */

    for (
        let i = pinceladas.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            pinceladas[i];


        /*
           Reducimos la vida.
        */

        p.vida -=
            p.velocidad;


        /*
           Si ya desapareció,
           la eliminamos.
        */

        if (
            p.vida <= 0
        ) {

            pinceladas.splice(
                i,
                1
            );

            continue;

        }


        /*
           Creamos un degradado
           suave.
        */

        const radio =
            Math.max(
                p.ancho,
                p.alto
            );


        const gradiente =
            ctx.createRadialGradient(

                0,
                0,
                0,

                0,
                0,
                radio

            );


        /*
           La parte central
           es transparente.

           Esto permite ver
           la página real.
        */

        gradiente.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${p.vida}
            )`
        );


        gradiente.addColorStop(
            .35,
            `rgba(
                255,
                255,
                255,
                ${p.vida * .75}
            )`
        );


        gradiente.addColorStop(
            .75,
            `rgba(
                255,
                255,
                255,
                ${p.vida * .25}
            )`
        );


        gradiente.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        /*
           Pintamos la forma.
        */

        ctx.save();


        ctx.translate(
            p.x,
            p.y
        );


        ctx.rotate(
            p.angulo
        );


        ctx.scale(
            1,
            p.alto /
            p.ancho
        );


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.fillStyle =
            gradiente;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            p.ancho,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }


    /*
       Próximo frame
    */

    requestAnimationFrame(
        dibujar
    );

}


dibujar();


/* =====================================================
   CLICK PARA ENTRAR
===================================================== */

let entrando =
    false;


document.addEventListener(
    "click",
    function() {

        if (
            entrando
        ) return;


        entrando = true;


        /*
           Quitamos niebla
        */

        document
            .getElementById(
                "capaNiebla"
            )
            .classList
            .add(
                "salir"
            );


        canvas
            .classList
            .add(
                "salir"
            );


        logo
            .classList
            .add(
                "salir"
            );


        /*
           Después de la transición
        */

        setTimeout(
            function() {

                document
                    .getElementById(
                        "capaNiebla"
                    )
                    .style
                    .display =
                    "none";


                canvas.style.display =
                    "none";


                logo.style.display =
                    "none";


                document.body.style.overflow =
                    "auto";

            },
            1300
        );

    }
);


</script>

</body>
</html>
