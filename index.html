<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    background: #080808;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   WEB PRINCIPAL
========================================================= */

.pagina {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #3a3a3a 0%,
            #252525 32%,
            #111111 68%,
            #080808 100%
        );

    position: relative;
    z-index: 1;
}

/* textura industrial muy sutil */

.pagina::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 8px
        );

    pointer-events: none;
    z-index: 0;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
    z-index: 2;

    padding: 60px 20px;
}

.hero-logo {
    width: min(700px, 82vw);
    height: auto;

    display: block;

    filter:
        drop-shadow(0 12px 30px rgba(0,0,0,0.6));

    user-select: none;
    pointer-events: none;
}

.hero-line {
    width: min(600px, 75vw);
    height: 1px;

    margin-top: 35px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.7),
            transparent
        );
}

.hero-subtitle {
    margin-top: 18px;

    font-size: 12px;
    letter-spacing: 5px;

    color: rgba(255,255,255,0.62);

    font-weight: 500;
}


/* =========================================================
   HIGHLIGHTS
========================================================= */

.highlights {
    position: relative;
    z-index: 2;

    padding: 150px 0 220px;

    overflow: hidden;
}

.section-title {
    text-align: center;

    font-size: clamp(42px, 7vw, 100px);
    font-weight: 900;

    letter-spacing: -4px;

    margin-bottom: 25px;
}

.section-description {
    max-width: 650px;

    margin: 0 auto 130px;

    padding: 0 25px;

    text-align: center;

    color: rgba(255,255,255,0.55);

    line-height: 1.7;

    font-size: 15px;
}


/* =========================================================
   FA 470CC
========================================================= */

.highlight {
    position: relative;

    min-height: 1700px;

    padding: 0 20px;
}

.highlight-info {
    width: min(900px, 90vw);

    margin: 0 auto 80px;

    text-align: center;
}

.highlight-number {
    font-size: 12px;

    letter-spacing: 5px;

    color: rgba(255,255,255,0.4);

    margin-bottom: 15px;
}

.highlight-title {
    font-size: clamp(45px, 8vw, 110px);

    font-weight: 900;

    letter-spacing: -5px;

    line-height: 0.9;
}

.highlight-subtitle {
    margin-top: 25px;

    color: rgba(255,255,255,0.55);

    letter-spacing: 3px;

    font-size: 12px;
}


/* =========================================================
   VIDEO VERTICAL
========================================================= */

.vertical-video-wrap {
    width: min(380px, 75vw);

    margin: 0 auto;

    position: relative;

    perspective: 1200px;
}

.vertical-video {
    width: 100%;
    height: auto;

    display: block;

    border-radius: 4px;

    background: #000;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.7);

    transform:
        translate3d(0, 80px, 0)
        scale(0.82)
        rotateX(12deg);

    opacity: 0;

    transition:
        transform 1s cubic-bezier(.16,1,.3,1),
        opacity 0.8s ease;

    will-change: transform, opacity;
}

.vertical-video.active {
    transform:
        translate3d(0, 0, 0)
        scale(1)
        rotateX(0deg);

    opacity: 1;
}


/* =========================================================
   MACHINE TEXT
========================================================= */

.machine-text {
    width: min(1000px, 90vw);

    margin: 170px auto;

    text-align: center;

    opacity: 0;
    transform: translateY(60px);

    transition:
        opacity 0.9s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

.machine-text.active {
    opacity: 1;
    transform: translateY(0);
}

.machine-small {
    font-size: 11px;

    letter-spacing: 5px;

    color: rgba(255,255,255,0.4);

    margin-bottom: 20px;
}

.machine-big {
    font-size: clamp(50px, 9vw, 130px);

    font-weight: 900;

    letter-spacing: -6px;

    line-height: 0.85;
}


/* =========================================================
   YOUTUBE
========================================================= */

.youtube-wrap {
    width: min(1100px, 92vw);

    margin: 0 auto;

    opacity: 0;

    transform: translateY(80px);

    transition:
        opacity 1s ease,
        transform 1.1s cubic-bezier(.16,1,.3,1);
}

.youtube-wrap.active {
    opacity: 1;

    transform: translateY(0);
}

.youtube-title {
    margin-bottom: 25px;

    font-size: 12px;

    letter-spacing: 4px;

    color: rgba(255,255,255,0.45);

    text-align: center;
}

.youtube-frame {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.7);
}

.youtube-frame iframe {
    width: 100%;
    height: 100%;

    border: 0;
}


/* =========================================================
   SCREENSAVER
========================================================= */

#screensaver {
    position: fixed;

    inset: 0;

    z-index: 9999;

    background: #999;

    cursor: none;

    overflow: hidden;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

#screensaver.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* niebla */

#niebla {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   LOGO SECUNDARIO
========================================================= */

.screensaver-logo {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(330px, 45vw);

    transform: translate(-50%, -50%);

    z-index: 2;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(0 15px 30px rgba(0,0,0,0.35));
}

.screensaver-hint {
    position: absolute;

    bottom: 45px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 3;

    font-size: 10px;

    letter-spacing: 4px;

    color: rgba(255,255,255,0.45);

    pointer-events: none;

    white-space: nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .hero {
        min-height: 90vh;
    }

    .hero-subtitle {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .highlights {
        padding-top: 100px;
    }

    .section-description {
        margin-bottom: 90px;
    }

    .highlight {
        min-height: 1450px;
    }

    .machine-text {
        margin: 120px auto;
    }

    .screensaver-logo {
        width: 55vw;
    }

    .screensaver-hint {
        bottom: 30px;

        font-size: 8px;

        letter-spacing: 3px;
    }
}
</style>
</head>


<body>


<!-- =======================================================
     WEB PRINCIPAL
======================================================== -->

<main class="pagina">


    <!-- HERO -->

    <section class="hero">

        <img
            src="logo-principal.png"
            class="hero-logo"
            alt="JOS3"
        >

        <div class="hero-line"></div>

        <div class="hero-subtitle">
            AUTOMOTIVE · PHOTOGRAPHY · LIFESTYLE
        </div>

    </section>



    <!-- HIGHLIGHTS -->

    <section class="highlights">

        <h2 class="section-title">
            HIGHLIGHTS
        </h2>

        <p class="section-description">
            Máquinas, experiencias y momentos que merecen ser recordados.
            Cada proyecto tiene su propia historia.
        </p>



        <!-- FA 470CC -->

        <article class="highlight">

            <div class="highlight-info">

                <div class="highlight-number">
                    01 / MACHINE
                </div>

                <h3 class="highlight-title">
                    FA 470CC
                </h3>

                <div class="highlight-subtitle">
                    PROBANDO UNA MÁQUINA DIFERENTE
                </div>

            </div>



            <!-- VIDEO VERTICAL -->

            <div class="vertical-video-wrap">

                <video
                    id="faVideo"
                    class="vertical-video"
                    src="fa470-vertical.mp4"
                    muted
                    loop
                    playsinline
                    preload="metadata"
                ></video>

            </div>



            <!-- TEXTO -->

            <div
                id="machineText"
                class="machine-text"
            >

                <div class="machine-small">
                    THE MACHINE
                </div>

                <div class="machine-big">
                    FA 470CC
                </div>

            </div>



            <!-- YOUTUBE -->

            <div
                id="youtubeBlock"
                class="youtube-wrap"
            >

                <div class="youtube-title">
                    FULL VIDEO
                </div>

                <div class="youtube-frame">

                    <iframe
                        src="https://www.youtube.com/embed/sMszBMthOQI?rel=0&modestbranding=1"
                        title="PROBANDO FA 470CC"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen
                    ></iframe>

                </div>

            </div>

        </article>

    </section>

</main>



<!-- =======================================================
     SCREENSAVER
======================================================== -->

<div id="screensaver">

    <canvas id="niebla"></canvas>

    <img
        src="logo-secundario.png"
        class="screensaver-logo"
        alt="J3"
    >

    <div class="screensaver-hint">
        MOVE TO EXPLORE · CLICK TO ENTER
    </div>

</div>



<script>

/* =========================================================
   RECARGA SIEMPRE ARRIBA
========================================================= */

history.scrollRestoration = "manual";

window.addEventListener("load", () => {
    window.scrollTo(0, 0);
});

window.addEventListener("pageshow", () => {
    window.scrollTo(0, 0);
});


/* =========================================================
   SCREENSAVER — TRAZO CONTINUO
========================================================= */

const screensaver = document.getElementById("screensaver");
const canvas = document.getElementById("niebla");

const ctx = canvas.getContext("2d", {
    alpha: true
});

let width = 0;
let height = 0;
let dpr = 1;


/*
    En vez de crear óvalos individuales:

    ANTES:
    punto + punto + punto + punto

    AHORA:
    un único recorrido continuo.

    Esto evita que el ojo pueda detectar las formas
    individuales que construyen la estela.
*/

const points = [];

let mouseX = -1000;
let mouseY = -1000;

let previousX = -1000;
let previousY = -1000;

let lastMoveTime = 0;

let animationFrame = null;


/* =========================================================
   CONFIGURACIÓN DE LA ESTELA
========================================================= */

const TRAIL_LIFE = 760;

const MIN_DISTANCE = 3;

const BASE_WIDTH = 115;

const MAX_POINTS = 90;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas,
    { passive: true }
);

resizeCanvas();


/* =========================================================
   MOVIMIENTO DEL RATÓN
========================================================= */

window.addEventListener(
    "mousemove",
    (event) => {

        mouseX = event.clientX;
        mouseY = event.clientY;

        const now = performance.now();

        /*
            Si acabamos de aparecer o hemos estado quietos,
            empezamos un trazo nuevo.
        */

        if (
            previousX < 0 ||
            previousY < 0 ||
            now - lastMoveTime > TRAIL_LIFE
        ) {

            points.length = 0;

            previousX = mouseX;
            previousY = mouseY;

            lastMoveTime = now;

            return;
        }


        const dx = mouseX - previousX;
        const dy = mouseY - previousY;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );


        if (distance < MIN_DISTANCE) {
            return;
        }


        /*
            Interpolamos los puntos.

            Esto hace que incluso si el ratón se mueve
            muy rápido, el recorrido siga siendo continuo.
        */

        const steps = Math.max(
            1,
            Math.ceil(distance / 8)
        );


        for (let i = 1; i <= steps; i++) {

            const t = i / steps;

            const x =
                previousX +
                dx * t;

            const y =
                previousY +
                dy * t;


            points.push({
                x,
                y,
                time: now
            });
        }


        /*
            Limitar memoria.
        */

        if (points.length > MAX_POINTS) {

            points.splice(
                0,
                points.length - MAX_POINTS
            );
        }


        previousX = mouseX;
        previousY = mouseY;

        lastMoveTime = now;
    },
    { passive: true }
);


/* =========================================================
   CURSOR FUERA DE LA PANTALLA
========================================================= */

window.addEventListener(
    "mouseout",
    (event) => {

        if (!event.relatedTarget) {

            mouseX = -1000;
            mouseY = -1000;

            previousX = -1000;
            previousY = -1000;
        }
    },
    { passive: true }
);


/* =========================================================
   SUAVIZADO DE PUNTOS
========================================================= */

function smoothPath(path) {

    if (path.length < 2) {
        return;
    }


    ctx.beginPath();

    ctx.moveTo(
        path[0].x,
        path[0].y
    );


    for (let i = 1; i < path.length - 1; i++) {

        const current = path[i];

        const next = path[i + 1];

        const middleX =
            (current.x + next.x) / 2;

        const middleY =
            (current.y + next.y) / 2;


        ctx.quadraticCurveTo(
            current.x,
            current.y,
            middleX,
            middleY
        );
    }


    const last =
        path[path.length - 1];

    const previous =
        path[path.length - 2];


    ctx.quadraticCurveTo(
        previous.x,
        previous.y,
        last.x,
        last.y
    );
}


/* =========================================================
   DIBUJAR ESTELA
========================================================= */

function drawTrail(now) {

    /*
        Eliminar puntos demasiado antiguos.
    */

    while (
        points.length &&
        now - points[0].time > TRAIL_LIFE
    ) {

        points.shift();
    }


    /*
        Limpiar completamente.
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (points.length < 2) {
        return;
    }


    /*
        Construimos una copia temporal con
        solamente los puntos todavía vivos.
    */

    const alive = [];


    for (const point of points) {

        const age =
            now - point.time;

        if (age < TRAIL_LIFE) {

            alive.push(point);
        }
    }


    if (alive.length < 2) {
        return;
    }


    /*
        -----------------------------------------------------
        CAPA PRINCIPAL
        -----------------------------------------------------

        Una única línea gruesa y continua.
        Nada de círculos ni stamps.
    */

    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /*
        Desenfoque suficientemente grande para que
        el borde no revele la geometría interna.
    */

    ctx.filter = "blur(24px)";

    ctx.globalAlpha = 0.95;

    ctx.lineWidth = BASE_WIDTH;

    smoothPath(alive);

    ctx.stroke();

    ctx.restore();


    /*
        -----------------------------------------------------
        SEGUNDA CAPA
        -----------------------------------------------------

        Una pasada más ancha y suave.
        Sirve para que la estela tenga un aspecto
        de pincel y no de "línea digital".
    */

    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.filter = "blur(45px)";

    ctx.globalAlpha = 0.48;

    ctx.lineWidth = BASE_WIDTH * 1.45;

    smoothPath(alive);

    ctx.stroke();

    ctx.restore();


    /*
        -----------------------------------------------------
        FADE TEMPORAL
        -----------------------------------------------------

        La parte antigua desaparece progresivamente.
        No hay cortes bruscos.
    */

    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.filter = "blur(18px)";

    const oldest =
        alive[0].time;

    const newest =
        alive[alive.length - 1].time;

    const lifetime =
        Math.max(1, newest - oldest);


    /*
        Dibujamos segmentos de forma continua
        pero sin crear "marcas" visibles.
    */

    ctx.lineWidth =
        BASE_WIDTH * 0.72;


    for (
        let i = 1;
        i < alive.length;
        i++
    ) {

        const p1 = alive[i - 1];
        const p2 = alive[i];

        const age =
            now - p1.time;

        const fade =
            Math.max(
                0,
                1 - age / TRAIL_LIFE
            );


        ctx.globalAlpha =
            fade * 0.18;


        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   NIEBLA
========================================================= */

function drawFog() {

    /*
        Fondo gris continuo.
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    gradient.addColorStop(
        0,
        "#bdbdbd"
    );

    gradient.addColorStop(
        0.5,
        "#9a9a9a"
    );

    gradient.addColorStop(
        1,
        "#777777"
    );


    ctx.globalCompositeOperation =
        "source-over";

    ctx.globalAlpha = 1;

    ctx.filter = "none";

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   LOOP DEL SCREENSAVER
========================================================= */

function renderScreensaver(now) {

    /*
        Primero ponemos la niebla.
    */

    drawFog();


    /*
        Después quitamos de la niebla
        el trazo continuo.
    */

    drawTrail(now);


    animationFrame =
        requestAnimationFrame(
            renderScreensaver
        );
}


animationFrame =
    requestAnimationFrame(
        renderScreensaver
    );


/* =========================================================
   ENTRAR EN LA WEB
========================================================= */

screensaver.addEventListener(
    "click",
    () => {

        screensaver.classList.add(
            "hidden"
        );

        /*
            Paramos completamente el canvas
            cuando ya no es necesario.

            Esto evita gastar CPU durante
            toda la navegación de la web.
        */

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );

            animationFrame = null;
        }

        canvas.style.display = "none";

        document.body.style.cursor = "auto";
    }
);


/* =========================================================
   HIGHLIGHTS — ANIMACIONES
========================================================= */

const faVideo =
    document.getElementById("faVideo");

const machineText =
    document.getElementById("machineText");

const youtubeBlock =
    document.getElementById("youtubeBlock");


let highlightTicking = false;


/* =========================================================
   SCROLL HIGHLIGHTS
========================================================= */

function updateHighlights() {

    const viewportCenter =
        window.innerHeight / 2;


    /*
        -----------------------------------------------------
        VIDEO VERTICAL
        -----------------------------------------------------
    */

    const videoRect =
        faVideo.getBoundingClientRect();


    const videoCenter =
        videoRect.top +
        videoRect.height / 2;


    const distance =
        Math.abs(
            videoCenter -
            viewportCenter
        );


    /*
        Solo se activa cuando está realmente
        cerca del centro.
    */

    const videoIsCentered =
        distance <
        window.innerHeight * 0.24;


    if (videoIsCentered) {

        faVideo.classList.add(
            "active"
        );


        if (faVideo.paused) {

            faVideo.play().catch(() => {});
        }

    } else {

        faVideo.classList.remove(
            "active"
        );


        if (!faVideo.paused) {

            faVideo.pause();
        }
    }


    /*
        -----------------------------------------------------
        TEXTO
        -----------------------------------------------------
    */

    const textRect =
        machineText.getBoundingClientRect();


    const textCenter =
        textRect.top +
        textRect.height / 2;


    const textVisible =
        Math.abs(
            textCenter -
            viewportCenter
        ) <
        window.innerHeight * 0.45;


    if (textVisible) {

        machineText.classList.add(
            "active"
        );

    } else {

        machineText.classList.remove(
            "active"
        );
    }


    /*
        -----------------------------------------------------
        YOUTUBE
        -----------------------------------------------------
    */

    const youtubeRect =
        youtubeBlock.getBoundingClientRect();


    const youtubeCenter =
        youtubeRect.top +
        youtubeRect.height / 2;


    const youtubeVisible =
        youtubeCenter <
        window.innerHeight * 1.1 &&
        youtubeCenter >
        -window.innerHeight * 0.2;


    if (youtubeVisible) {

        youtubeBlock.classList.add(
            "active"
        );

    } else {

        youtubeBlock.classList.remove(
            "active"
        );
    }


    highlightTicking = false;
}


/* =========================================================
   SCROLL OPTIMIZADO
========================================================= */

window.addEventListener(
    "scroll",
    () => {

        if (!highlightTicking) {

            highlightTicking = true;

            requestAnimationFrame(
                updateHighlights
            );
        }
    },
    {
        passive: true
    }
);


/* =========================================================
   PRIMERA ACTUALIZACIÓN
========================================================= */

updateHighlights();


/* =========================================================
   LIMPIEZA AL CERRAR
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );
        }
    }
);

</script>

</body>
</html>
