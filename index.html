<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PÁGINA PRINCIPAL
===================================================== */

.pagina {

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 42%,
            #3a3a3a 0%,
            #1d1d1d 48%,
            #0b0b0b 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}


/* =====================================================
   DETALLES INDUSTRIALES DEL FONDO
===================================================== */

.pagina::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.025) 25%,
            transparent 25%,
            transparent 50%,
            rgba(255,255,255,.025) 50%,
            rgba(255,255,255,.025) 75%,
            transparent 75%
        );

    background-size:
        8px 8px;

    opacity: .35;

    pointer-events: none;
}


/* =====================================================
   CONTENIDO PRINCIPAL
===================================================== */

.contenido {

    position: relative;

    z-index: 2;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   LOGO PRINCIPAL JOS3
===================================================== */

.logo-principal {

    width:
        min(
            620px,
            72vw
        );

    max-height: 45vh;

    object-fit: contain;

    filter:
        drop-shadow(
            0 15px 35px
            rgba(
                0,
                0,
                0,
                .65
            )
        );

}


/* =====================================================
   TEXTO INFERIOR PROVISIONAL
===================================================== */

.subtitulo {

    margin-top: 35px;

    font-size: 13px;

    letter-spacing: 8px;

    text-transform: uppercase;

    color: #aaa;

    opacity: .65;

}


/* =====================================================
   LÍNEA INDUSTRIAL
===================================================== */

.linea {

    width: 180px;

    height: 1px;

    margin-top: 22px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #999,
            transparent
        );

    opacity: .5;

}


/* =====================================================
   CANVAS DEL SALVAPANTALLAS
===================================================== */

#niebla {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    pointer-events: none;

    transition:
        opacity 1.1s ease;

}


/* =====================================================
   LOGO SECUNDARIO DEL SALVAPANTALLAS
===================================================== */

.logo {

    position: fixed;

    z-index: 30;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            300px,
            45vw
        );

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(
                0,
                0,
                0,
                .22
            )
        );

    transition:

        opacity .6s ease,

        transform .8s ease;

}


/* =====================================================
   SALIDA
===================================================== */

#niebla.salir {

    opacity: 0;

}


.logo.salir {

    opacity: 0;

    transform:

        translate(
            -50%,
            -50%
        )

        scale(1.25);

}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 700px) {

    .logo {

        width: 55vw;

    }

    .logo-principal {

        width: 82vw;

    }

    .subtitulo {

        font-size: 10px;

        letter-spacing: 5px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PÁGINA REAL
===================================================== -->

<div class="pagina">

    <div class="contenido">

        <!-- LOGO PRINCIPAL -->

        <img
            src="logo-principal.png"
            alt="JOS3"
            class="logo-principal"
        >


        <!-- ELEMENTOS PROVISIONALES -->

        <div class="linea"></div>

        <div class="subtitulo">
            AUTOMOTIVE · PHOTOGRAPHY · LIFESTYLE
        </div>

    </div>

</div>


<!-- =====================================================
     SALVAPANTALLAS
     NO MODIFICAR
===================================================== -->

<canvas
    id="niebla">
</canvas>


<!-- =====================================================
     LOGO SECUNDARIO J3
     NO MODIFICAR
===================================================== -->

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>


/* =====================================================
   CANVAS
   SALVAPANTALLAS — NO MODIFICAR
===================================================== */

const canvas =
    document.getElementById(
        "niebla"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


let ancho = 0;
let alto = 0;


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function ajustarCanvas() {

    ancho =
        window.innerWidth;

    alto =
        window.innerHeight;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        ancho * dpr;

    canvas.height =
        alto * dpr;

    canvas.style.width =
        ancho + "px";

    canvas.style.height =
        alto + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


/* =====================================================
   PINCEL
===================================================== */

let pinceladas = [];


let ultimoX = null;
let ultimoY = null;


/* =====================================================
   RATÓN
===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            event.clientX;

        const y =
            event.clientY;


        if (
            ultimoX === null
        ) {

            ultimoX = x;
            ultimoY = y;

            return;

        }


        const dx =
            x - ultimoX;

        const dy =
            y - ultimoY;

        const distancia =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distancia < 2
        ) {

            return;

        }


        const cantidad =
            Math.max(
                1,
                Math.ceil(
                    distancia / 6
                )
            );


        const angulo =
            Math.atan2(
                dy,
                dx
            );


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const t =
                i / cantidad;


            const px =
                ultimoX +
                dx * t;

            const py =
                ultimoY +
                dy * t;


            const desviacion =
                (
                    Math.random() - .5
                ) * 18;


            const anchoPincel =
                38 +
                Math.random() * 28;


            const altoPincel =
                18 +
                Math.random() * 18;


            pinceladas.push({

                x:
                    px +
                    Math.cos(
                        angulo +
                        Math.PI / 2
                    ) *
                    desviacion,

                y:
                    py +
                    Math.sin(
                        angulo +
                        Math.PI / 2
                    ) *
                    desviacion,

                ancho:
                    anchoPincel,

                alto:
                    altoPincel,

                angulo:
                    angulo +
                    (
                        Math.random() - .5
                    ) *
                    .45,

                vida:
                    1,

                velocidad:
                    .025 +
                    Math.random() * .012

            });

        }


        ultimoX = x;
        ultimoY = y;

    }
);


/* =====================================================
   DIBUJAR SALVAPANTALLAS
===================================================== */

function dibujar() {


    const fondo =
        ctx.createRadialGradient(

            ancho / 2,
            alto / 2,
            0,

            ancho / 2,
            alto / 2,
            Math.max(
                ancho,
                alto
            )

        );


    fondo.addColorStop(
        0,
        "#bdbdbd"
    );

    fondo.addColorStop(
        .55,
        "#969696"
    );

    fondo.addColorStop(
        1,
        "#707070"
    );


    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        fondo;


    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );


    for (
        let i =
            pinceladas.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            pinceladas[i];


        p.vida -=
            p.velocidad;


        if (
            p.vida <= 0
        ) {

            pinceladas.splice(
                i,
                1
            );

            continue;

        }


        const radio =
            Math.max(
                p.ancho,
                p.alto
            );


        const gradiente =
            ctx.createRadialGradient(

                0,
                0,
                0,

                0,
                0,
                radio

            );


        gradiente.addColorStop(
            0,
            "rgba(0,0,0,1)"
        );


        gradiente.addColorStop(
            .35,
            "rgba(0,0,0,.75)"
        );


        gradiente.addColorStop(
            .70,
            "rgba(0,0,0,.30)"
        );


        gradiente.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.save();


        ctx.translate(
            p.x,
            p.y
        );


        ctx.rotate(
            p.angulo
        );


        ctx.scale(
            1,
            p.alto /
            p.ancho
        );


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.globalAlpha =
            p.vida;


        ctx.fillStyle =
            gradiente;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            p.ancho,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }


    requestAnimationFrame(
        dibujar
    );

}


dibujar();


/* =====================================================
   ENTRADA A LA WEB
===================================================== */

const logo =
    document.getElementById(
        "logo"
    );


let entrando = false;


document.addEventListener(
    "click",
    function() {

        if (
            entrando
        ) {

            return;

        }


        entrando = true;


        document.body.style.cursor =
            "default";


        canvas.classList.add(
            "salir"
        );


        logo.classList.add(
            "salir"
        );


        setTimeout(
            function() {

                canvas.style.display =
                    "none";

                logo.style.display =
                    "none";

                document.body.style.overflow =
                    "auto";

            },
            1200
        );

    }
);

</script>

</body>
</html>
