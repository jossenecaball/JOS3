<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #bdbdbd;
}


/* =====================================================
   WEB REAL QUE ESTÁ DEBAJO
===================================================== */

.pagina {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            #f2f2f2 0%,
            #d2d2d2 45%,
            #a8a8a8 100%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;
}

.contenido {
    text-align: center;
}

.contenido h1 {
    font-size: clamp(100px, 18vw, 260px);
    font-weight: 900;
    letter-spacing: -12px;
    color: #111;
}

.contenido p {
    margin-top: 10px;
    font-size: 18px;
    letter-spacing: 6px;
    color: #222;
    opacity: .5;
}


/* =====================================================
   PANTALLA DE ENTRADA
===================================================== */

.entrada {
    position: fixed;
    inset: 0;

    z-index: 10;

    background:
        radial-gradient(
            circle at center,
            #f4f4f4 0%,
            #dddddd 55%,
            #c8c8c8 100%
        );
}


/* =====================================================
   CANVAS DE LA NIEBLA
===================================================== */

#niebla {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 15;

    pointer-events: none;
}


/* =====================================================
   LOGO
===================================================== */

.logo {
    position: fixed;

    z-index: 30;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(300px, 45vw);

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px rgba(0,0,0,.20)
        );

    transition:
        opacity .6s ease,
        transform .8s ease;
}


/* =====================================================
   TRANSICIÓN FINAL
===================================================== */

.entrada.final {
    opacity: 0;

    transition:
        opacity 1.2s ease;
}

.logo.final {
    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(1.25);
}

#niebla.final {
    opacity: 0;

    transition:
        opacity .8s ease;
}

</style>
</head>


<body>


<!-- =====================================================
     PÁGINA REAL
===================================================== -->

<div class="pagina">

    <div class="contenido">

        <h1>JOS3</h1>

        <p>PÁGINA PERSONAL</p>

    </div>

</div>


<!-- =====================================================
     CAPA DE ENTRADA
===================================================== -->

<div class="entrada" id="entrada"></div>


<!-- =====================================================
     NIEBLA
===================================================== -->

<canvas id="niebla"></canvas>


<!-- =====================================================
     LOGO
===================================================== -->

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const canvas = document.getElementById("niebla");

const ctx = canvas.getContext("2d");

const entrada = document.getElementById("entrada");

const logo = document.getElementById("logo");


let ancho;
let alto;


function ajustarCanvas() {

    ancho = window.innerWidth;
    alto = window.innerHeight;

    canvas.width = ancho * devicePixelRatio;
    canvas.height = alto * devicePixelRatio;

    canvas.style.width = ancho + "px";
    canvas.style.height = alto + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}


ajustarCanvas();

window.addEventListener(
    "resize",
    ajustarCanvas
);


/* =====================================================
   RATÓN
===================================================== */

let raton = {

    x: ancho / 2,

    y: alto / 2

};


let posicion = {

    x: ancho / 2,

    y: alto / 2

};


/* =====================================================
   ESTELA
===================================================== */

const puntos = [];

const cantidadPuntos = 18;


for (
    let i = 0;
    i < cantidadPuntos;
    i++
) {

    puntos.push({

        x: raton.x,

        y: raton.y,

        vida: 0

    });

}


/* =====================================================
   MOVIMIENTO
===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        raton.x = event.clientX;

        raton.y = event.clientY;

    }
);


/* =====================================================
   DIBUJAR NIEBLA
===================================================== */

function dibujar() {


    /*
       Limpiamos el canvas
    */

    ctx.clearRect(
        0,
        0,
        ancho,
        alto
    );


    /*
       Actualizamos posición
    */

    posicion.x +=
        (raton.x - posicion.x) * 0.22;

    posicion.y +=
        (raton.y - posicion.y) * 0.22;


    /*
       Añadimos nuevo punto
    */

    puntos.unshift({

        x: posicion.x,

        y: posicion.y,

        vida: 1

    });


    /*
       Limitamos la cantidad
    */

    if (
        puntos.length >
        cantidadPuntos
    ) {

        puntos.pop();

    }


    /* =================================================
       ESTELA DE NIEBLA
    ================================================= */

    puntos.forEach(
        function(punto, indice) {

            const escala =
                1 -
                indice /
                cantidadPuntos;


            const radioX =
                48 +
                escala * 25;


            const radioY =
                32 +
                escala * 18;


            /*
               Nube principal
            */

            const gradiente =
                ctx.createRadialGradient(

                    punto.x,
                    punto.y,

                    0,

                    punto.x,
                    punto.y,

                    radioX

                );


            /*
               Transparencia de la nube
            */

            const alpha =
                0.92 *
                escala *
                escala;


            gradiente.addColorStop(
                0,
                `rgba(255,255,255,${alpha})`
            );


            gradiente.addColorStop(
                .35,
                `rgba(255,255,255,${alpha * .65})`
            );


            gradiente.addColorStop(
                1,
                "rgba(255,255,255,0)"
            );


            ctx.save();


            /*
               Forma ovalada
            */

            ctx.translate(
                punto.x,
                punto.y
            );


            ctx.scale(
                1,
                radioY / radioX
            );


            ctx.fillStyle =
                gradiente;


            ctx.beginPath();

            ctx.arc(
                0,
                0,
                radioX,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.restore();

        }
    );


    /*
       Siguiente frame
    */

    requestAnimationFrame(
        dibujar
    );

}


dibujar();


/* =====================================================
   CLICK
===================================================== */

document.addEventListener(
    "click",
    function() {


        entrada.classList.add(
            "final"
        );


        logo.classList.add(
            "final"
        );


        canvas.classList.add(
            "final"
        );


        setTimeout(
            function() {

                entrada.style.display =
                    "none";

                canvas.style.display =
                    "none";

                logo.style.display =
                    "none";

                document.body.style.overflow =
                    "auto";

            },
            1300
        );

    }
);


</script>

</body>
</html>
