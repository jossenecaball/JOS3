<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PÁGINA PRINCIPAL
===================================================== */

.pagina {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 40%,
            #f4f4f4 0%,
            #e2e2e2 45%,
            #cccccc 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    color: #111;
}


.contenido {

    text-align: center;

}


.contenido h1 {

    font-size:
        clamp(
            100px,
            18vw,
            260px
        );

    font-weight: 900;

    letter-spacing: -12px;

}


.contenido p {

    margin-top: 10px;

    font-size: 18px;

    letter-spacing: 6px;

    opacity: .5;

}


/* =====================================================
   CAPA DE SALVAPANTALLAS GRIS
===================================================== */

.capa-niebla {

    position: fixed;

    inset: 0;

    z-index: 10;

    /*
       Fondo grisáceo.
       Más oscuro que la página principal
       para que el efecto se diferencie.
    */

    background:
        radial-gradient(
            ellipse at center,
            rgba(175, 175, 175, 0.94) 0%,
            rgba(145, 145, 145, 0.96) 55%,
            rgba(115, 115, 115, 0.98) 100%
        );

    /*
       Ligero desenfoque para dar
       sensación de cristal/niebla.
    */

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    pointer-events: none;

}


/* =====================================================
   CANVAS DEL EFECTO PINCEL
===================================================== */

#niebla {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 20;

    pointer-events: none;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.logo {

    position: fixed;

    z-index: 30;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            300px,
            45vw
        );

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(
                0,
                0,
                0,
                .20
            )
        );

    transition:

        opacity .6s ease,

        transform .8s ease;

}


/* =====================================================
   TRANSICIÓN AL ENTRAR
===================================================== */

.capa-niebla.salir {

    opacity: 0;

    transition:
        opacity 1.1s ease;

}


#niebla.salir {

    opacity: 0;

    transition:
        opacity .8s ease;

}


.logo.salir {

    opacity: 0;

    transform:

        translate(
            -50%,
            -50%
        )

        scale(1.25);

}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 700px) {

    .logo {

        width: 55vw;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PÁGINA REAL
===================================================== -->

<div class="pagina">

    <div class="contenido">

        <h1>JOS3</h1>

        <p>PÁGINA PERSONAL</p>

    </div>

</div>


<!-- =====================================================
     SALVAPANTALLAS
===================================================== -->

<div
    class="capa-niebla"
    id="capaNiebla">
</div>


<!-- =====================================================
     CANVAS DEL PINCEL
===================================================== -->

<canvas
    id="niebla">
</canvas>


<!-- =====================================================
     LOGO J3
===================================================== -->

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "niebla"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let ancho;

let alto;


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function ajustarCanvas() {

    ancho =
        window.innerWidth;

    alto =
        window.innerHeight;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        ancho * dpr;


    canvas.height =
        alto * dpr;


    canvas.style.width =
        ancho + "px";


    canvas.style.height =
        alto + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


/* =====================================================
   POSICIÓN DEL RATÓN
===================================================== */

let raton = {

    x: ancho / 2,

    y: alto / 2

};


let ultimoX =
    raton.x;


let ultimoY =
    raton.y;


/* =====================================================
   PINCELADAS
===================================================== */

let pinceladas = [];


/* =====================================================
   MOVIMIENTO DEL RATÓN
===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            event.clientX;

        const y =
            event.clientY;


        /*
           Distancia recorrida
        */

        const dx =
            x - ultimoX;

        const dy =
            y - ultimoY;


        const distancia =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           Número de pinceladas
           según la distancia.
        */

        const cantidad =
            Math.max(
                1,
                Math.floor(
                    distancia / 7
                )
            );


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const porcentaje =
                i / cantidad;


            const px =
                ultimoX +
                dx * porcentaje;


            const py =
                ultimoY +
                dy * porcentaje;


            pinceladas.push({

                x: px,

                y: py,

                /*
                   Tamaño de la pincelada.
                */

                ancho:
                    32 +
                    Math.random() * 28,

                alto:
                    18 +
                    Math.random() * 20,

                /*
                   Dirección del movimiento.
                */

                angulo:
                    Math.atan2(
                        dy,
                        dx
                    ) +
                    (
                        Math.random() - .5
                    ) * .8,

                /*
                   Vida inicial.
                */

                vida: 1,

                /*
                   Velocidad de desaparición.
                   Aproximadamente menos de 1 segundo.
                */

                velocidad:
                    .022 +
                    Math.random() * .012

            });

        }


        ultimoX = x;

        ultimoY = y;

        raton.x = x;

        raton.y = y;

    }
);


/* =====================================================
   ANIMACIÓN DEL PINCEL
===================================================== */

function dibujar() {


    /*
       Limpiamos el canvas.
    */

    ctx.clearRect(
        0,
        0,
        ancho,
        alto
    );


    /*
       Recorremos todas las pinceladas.
    */

    for (
        let i = pinceladas.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            pinceladas[i];


        /*
           Reducimos la vida.
        */

        p.vida -=
            p.velocidad;


        /*
           Cuando desaparece,
           eliminamos la pincelada.
        */

        if (
            p.vida <= 0
        ) {

            pinceladas.splice(
                i,
                1
            );

            continue;

        }


        /*
           Radio máximo.
        */

        const radio =
            Math.max(
                p.ancho,
                p.alto
            );


        /*
           Degradado suave.
        */

        const gradiente =
            ctx.createRadialGradient(

                0,
                0,
                0,

                0,
                0,
                radio

            );


        /*
           Centro transparente.
        */

        gradiente.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${p.vida}
            )`
        );


        gradiente.addColorStop(
            .30,
            `rgba(
                255,
                255,
                255,
                ${p.vida * .75}
            )`
        );


        gradiente.addColorStop(
            .70,
            `rgba(
                255,
                255,
                255,
                ${p.vida * .25}
            )`
        );


        gradiente.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        /*
           Dibujamos la pincelada.
        */

        ctx.save();


        ctx.translate(
            p.x,
            p.y
        );


        ctx.rotate(
            p.angulo
        );


        ctx.scale(
            1,
            p.alto /
            p.ancho
        );


        /*
           destination-out hace
           transparente la niebla.
        */

        ctx.globalCompositeOperation =
            "destination-out";


        ctx.fillStyle =
            gradiente;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            p.ancho,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }


    requestAnimationFrame(
        dibujar
    );

}


dibujar();


/* =====================================================
   ENTRAR EN LA PÁGINA
===================================================== */

let entrando =
    false;


document.addEventListener(
    "click",
    function() {

        if (
            entrando
        ) return;


        entrando = true;


        /*
           Desaparece la niebla.
        */

        document
            .getElementById(
                "capaNiebla"
            )
            .classList
            .add(
                "salir"
            );


        /*
           Desaparece el efecto.
        */

        canvas
            .classList
            .add(
                "salir"
            );


        /*
           Desaparece el logo.
        */

        logo
            .classList
            .add(
                "salir"
            );


        /*
           Terminada la transición.
        */

        setTimeout(
            function() {

                document
                    .getElementById(
                        "capaNiebla"
                    )
                    .style
                    .display =
                    "none";


                canvas.style.display =
                    "none";


                logo.style.display =
                    "none";


                document.body.style.overflow =
                    "auto";

            },
            1300
        );

    }
);

</script>

</body>
</html>
