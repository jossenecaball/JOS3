<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JOS3</title>


    <style>

        /* ==================================================
           CONFIGURACIÓN GENERAL
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #dededc;
        }


        /* ==================================================
           PÁGINA REAL DE JOS3
        ================================================== */

        .pagina {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    #ffffff 0%,
                    #e4e4e2 45%,
                    #c7c7c4 100%
                );

            color: #111;

            overflow: hidden;
        }


        /* Brillo ambiental */

        .pagina::before {

            content: "";

            position: absolute;

            inset: -20%;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.9),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,255,255,.55),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* ==================================================
           CONTENIDO DE LA FUTURA WEB
        ================================================== */

        .contenido-web {

            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            z-index: 2;
        }


        .titulo-web {

            font-size:
                clamp(100px, 17vw, 260px);

            font-weight: 900;

            letter-spacing: -15px;

            color: #111;

            line-height: .8;
        }


        .subtitulo-web {

            margin-top: 35px;

            font-size: 13px;

            letter-spacing: 9px;

            color: #555;

            text-transform: uppercase;
        }


        /* ==================================================
           PANTALLA DE ENTRADA
        ================================================== */

        .entrada {

            position: fixed;

            inset: 0;

            z-index: 10;

            background:

                rgba(226,226,223,.96);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: none;

            transition:
                opacity 1.4s ease,
                visibility 1.4s ease;
        }


        /* ==================================================
           LOGO CENTRAL
        ================================================== */

        .logo-central {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(520px, 55vw);

            z-index: 30;

            pointer-events: none;

            user-select: none;

            transition:

                transform 1.2s
                cubic-bezier(.16,1,.3,1),

                opacity 1s ease;
        }


        .logo-central img {

            display: block;

            width: 100%;
            height: auto;

            filter:

                drop-shadow(
                    0 25px 35px
                    rgba(0,0,0,.20)
                );
        }


        /* ==================================================
           LENTE DEL RATÓN
        ================================================== */

        .lente {

            position: fixed;

            left: 50%;
            top: 50%;

            width: 320px;
            height: 320px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            overflow: hidden;

            z-index: 20;

            pointer-events: none;

            opacity: 0;

            background:
                rgba(255,255,255,.08);

            border:

                1px solid
                rgba(255,255,255,.9);

            box-shadow:

                0 0 35px
                rgba(255,255,255,.55),

                0 20px 70px
                rgba(0,0,0,.16),

                inset 0 0 35px
                rgba(255,255,255,.35);

            transition:
                opacity .4s ease;
        }


        /* ==================================================
           WEB REVELADA DENTRO DE LA LENTE
        ================================================== */

        .web-revelada {

            position: absolute;

            width: 100vw;
            height: 100vh;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1.10);

            background:

                radial-gradient(
                    circle at 50% 40%,
                    #ffffff 0%,
                    #e0e0de 45%,
                    #c3c3c0 100%
                );

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;
        }


        .web-revelada::before {

            content: "";

            position: absolute;

            inset: -20%;

            background:

                radial-gradient(
                    circle at 30% 30%,
                    rgba(255,255,255,.95),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 70% 70%,
                    rgba(255,255,255,.55),
                    transparent 35%
                );
        }


        .texto-revelado {

            position: relative;

            font-size:
                clamp(100px, 17vw, 260px);

            font-weight: 900;

            letter-spacing: -15px;

            color: #111;

            line-height: .8;
        }


        .texto-revelado-pequeno {

            position: relative;

            margin-top: 35px;

            font-size: 13px;

            letter-spacing: 9px;

            color: #555;

            text-transform: uppercase;
        }


        /* ==================================================
           REFLEJO DE LA LENTE
        ================================================== */

        .lente::before {

            content: "";

            position: absolute;

            width: 55%;
            height: 55%;

            top: -15%;
            left: -10%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255,255,255,.7),
                    transparent 65%
                );

            filter: blur(12px);

            z-index: 5;

            pointer-events: none;
        }


        .lente::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:

                linear-gradient(
                    130deg,
                    rgba(255,255,255,.30),
                    transparent 35%,
                    transparent 65%,
                    rgba(255,255,255,.12)
                );

            pointer-events: none;
        }


        /* ==================================================
           ESTADO FINAL — ENTRAR EN LA WEB
        ================================================== */

        .entrada.salir {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .entrada.salir .logo-central {

            transform:
                translate(-50%, -50%)
                scale(.75);

            opacity: 0;
        }


        /* ==================================================
           ANIMACIÓN DE EXPANSIÓN
        ================================================== */

        .entrada.expandir .lente {

            animation:
                expandirLente 1.4s
                cubic-bezier(.16,1,.3,1)
                forwards;
        }


        @keyframes expandirLente {

            0% {

                width: 320px;
                height: 320px;

                opacity: 1;
            }

            100% {

                width: 220vmax;
                height: 220vmax;

                opacity: 1;
            }
        }


        /* ==================================================
           MÓVILES
        ================================================== */

        @media (max-width: 700px) {

            .logo-central {

                width: 75vw;
            }

            .lente {

                width: 220px;
                height: 220px;
            }

            .titulo-web {

                font-size: 25vw;

                letter-spacing: -5px;
            }

            .subtitulo-web {

                font-size: 9px;

                letter-spacing: 5px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         PÁGINA PRINCIPAL
    ================================================== -->

    <main class="pagina">

        <div class="contenido-web">

            <div class="titulo-web">
                JOS3
            </div>

            <div class="subtitulo-web">
                Página personal
            </div>

        </div>

    </main>


    <!-- ==================================================
         PANTALLA DE ENTRADA
    ================================================== -->

    <section
        class="entrada"
        id="entrada"
    >


        <!-- LENTE -->

        <div
            class="lente"
            id="lente"
        >

            <div class="web-revelada">

                <div class="texto-revelado">
                    JOS3
                </div>

                <div class="texto-revelado-pequeno">
                    Página personal
                </div>

            </div>

        </div>


        <!-- LOGO CENTRAL -->

        <div class="logo-central">

            <img
                src="logo-secundario.png"
                alt="JOS3"
            >

        </div>


    </section>


    <script>


        /* ==================================================
           ELEMENTOS
        ================================================== */

        const entrada =
            document.getElementById("entrada");

        const lente =
            document.getElementById("lente");


        /* ==================================================
           POSICIÓN DEL RATÓN
        ================================================== */

        let ratonX =
            window.innerWidth / 2;

        let ratonY =
            window.innerHeight / 2;


        let actualX = ratonX;
        let actualY = ratonY;


        /* ==================================================
           MOVIMIENTO
        ================================================== */

        document.addEventListener(
            "mousemove",
            function(evento) {

                ratonX =
                    evento.clientX;

                ratonY =
                    evento.clientY;

                lente.style.opacity = "1";

            }
        );


        /* ==================================================
           MOVIMIENTO SUAVE
        ================================================== */

        function animar() {

            actualX +=
                (ratonX - actualX)
                * 0.10;

            actualY +=
                (ratonY - actualY)
                * 0.10;


            lente.style.left =
                actualX + "px";

            lente.style.top =
                actualY + "px";


            requestAnimationFrame(animar);
        }


        animar();


        /* ==================================================
           CLICK
        ================================================== */

        entrada.addEventListener(
            "click",
            function() {

                entrada.classList.add(
                    "expandir"
                );


                setTimeout(
                    function() {

                        entrada.classList.add(
                            "salir"
                        );

                    },
                    650
                );

            }
        );


        /* ==================================================
           TECLADO
        ================================================== */

        document.addEventListener(
            "keydown",
            function(evento) {

                if (
                    evento.key === "Enter" ||
                    evento.key === " "
                ) {

                    entrada.click();

                }

            }
        );


    </script>


</body>

</html>
