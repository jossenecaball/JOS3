<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PÁGINA PRINCIPAL
===================================================== */

.pagina {

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 40%,
            #f5f5f5 0%,
            #e1e1e1 50%,
            #c8c8c8 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    color: #111;
}


/* Contenido provisional */

.contenido {
    text-align: center;
}

.contenido h1 {

    font-size:
        clamp(
            100px,
            18vw,
            260px
        );

    font-weight: 900;

    letter-spacing: -12px;

}

.contenido p {

    margin-top: 10px;

    font-size: 18px;

    letter-spacing: 6px;

    opacity: .5;

}


/* =====================================================
   CANVAS DEL SALVAPANTALLAS
===================================================== */

#niebla {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    pointer-events: none;

    transition:
        opacity 1.1s ease;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.logo {

    position: fixed;

    z-index: 30;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            300px,
            45vw
        );

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(
                0,
                0,
                0,
                .22
            )
        );

    transition:

        opacity .6s ease,

        transform .8s ease;

}


/* =====================================================
   SALIDA
===================================================== */

#niebla.salir {

    opacity: 0;

}


.logo.salir {

    opacity: 0;

    transform:

        translate(
            -50%,
            -50%
        )

        scale(1.25);

}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 700px) {

    .logo {

        width: 55vw;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PÁGINA REAL
===================================================== -->

<div class="pagina">

    <div class="contenido">

        <h1>JOS3</h1>

        <p>PÁGINA PERSONAL</p>

    </div>

</div>


<!-- =====================================================
     SALVAPANTALLAS
===================================================== -->

<canvas
    id="niebla">
</canvas>


<!-- =====================================================
     LOGO
===================================================== -->

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "niebla"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


let ancho = 0;
let alto = 0;


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function ajustarCanvas() {

    ancho =
        window.innerWidth;

    alto =
        window.innerHeight;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        ancho * dpr;

    canvas.height =
        alto * dpr;

    canvas.style.width =
        ancho + "px";

    canvas.style.height =
        alto + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


/* =====================================================
   PINCEL
===================================================== */

let pinceladas = [];


/*
   Posición anterior del ratón
*/

let ultimoX = null;
let ultimoY = null;


/* =====================================================
   RATÓN
===================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            event.clientX;

        const y =
            event.clientY;


        /*
           Primer movimiento
        */

        if (
            ultimoX === null
        ) {

            ultimoX = x;
            ultimoY = y;

            return;

        }


        /*
           Distancia recorrida
        */

        const dx =
            x - ultimoX;

        const dy =
            y - ultimoY;

        const distancia =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           Si apenas se ha movido,
           no creamos una pincelada.
        */

        if (
            distancia < 2
        ) {

            return;

        }


        /*
           Cantidad de puntos
           dependiendo de la distancia.
        */

        const cantidad =
            Math.max(
                1,
                Math.ceil(
                    distancia / 6
                )
            );


        /*
           Dirección del pincel
        */

        const angulo =
            Math.atan2(
                dy,
                dx
            );


        /* =================================================
           CREAR PINTURA
        ================================================= */

        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const t =
                i / cantidad;


            /*
               Posición interpolada
            */

            const px =
                ultimoX +
                dx * t;

            const py =
                ultimoY +
                dy * t;


            /*
               Pequeña irregularidad
               para evitar círculos perfectos.
            */

            const desviacion =
                (
                    Math.random() - .5
                ) * 18;


            /*
               Tamaño de la pincelada
            */

            const anchoPincel =
                38 +
                Math.random() * 28;


            const altoPincel =
                18 +
                Math.random() * 18;


            pinceladas.push({

                x:
                    px +
                    Math.cos(
                        angulo +
                        Math.PI / 2
                    ) *
                    desviacion,

                y:
                    py +
                    Math.sin(
                        angulo +
                        Math.PI / 2
                    ) *
                    desviacion,

                ancho:
                    anchoPincel,

                alto:
                    altoPincel,

                angulo:
                    angulo +
                    (
                        Math.random() - .5
                    ) *
                    .45,

                /*
                   Duración aproximada
                   0.6 - 0.9 segundos
                */

                vida:
                    1,

                velocidad:
                    .025 +
                    Math.random() * .012

            });

        }


        ultimoX = x;
        ultimoY = y;

    }
);


/* =====================================================
   DIBUJAR SALVAPANTALLAS
===================================================== */

function dibujar() {


    /*
       -------------------------------------------------
       1. FONDO GRIS COMPLETAMENTE OPACO
       -------------------------------------------------
    */

    const fondo =
        ctx.createRadialGradient(

            ancho / 2,
            alto / 2,
            0,

            ancho / 2,
            alto / 2,
            Math.max(
                ancho,
                alto
            )

        );


    fondo.addColorStop(
        0,
        "#bdbdbd"
    );

    fondo.addColorStop(
        .55,
        "#969696"
    );

    fondo.addColorStop(
        1,
        "#707070"
    );


    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        fondo;


    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );


    /*
       -------------------------------------------------
       2. BORRAR LAS PINCELADAS
       -------------------------------------------------
    */

    for (
        let i =
            pinceladas.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            pinceladas[i];


        /*
           La marca se desvanece.
        */

        p.vida -=
            p.velocidad;


        /*
           Eliminar cuando desaparece.
        */

        if (
            p.vida <= 0
        ) {

            pinceladas.splice(
                i,
                1
            );

            continue;

        }


        /*
           Radio de la pincelada
        */

        const radio =
            Math.max(
                p.ancho,
                p.alto
            );


        /*
           Degradado.
        */

        const gradiente =
            ctx.createRadialGradient(

                0,
                0,
                0,

                0,
                0,
                radio

            );


        /*
           Centro completamente
           transparente.
        */

        gradiente.addColorStop(
            0,
            "rgba(0,0,0,1)"
        );


        /*
           Zona intermedia.
        */

        gradiente.addColorStop(
            .35,
            "rgba(0,0,0,.75)"
        );


        gradiente.addColorStop(
            .70,
            "rgba(0,0,0,.30)"
        );


        /*
           Borde suave.
        */

        gradiente.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        /*
           Borramos el gris.
        */

        ctx.save();


        ctx.translate(
            p.x,
            p.y
        );


        ctx.rotate(
            p.angulo
        );


        ctx.scale(
            1,
            p.alto /
            p.ancho
        );


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.globalAlpha =
            p.vida;


        ctx.fillStyle =
            gradiente;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            p.ancho,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }


    /*
       Siguiente frame
    */

    requestAnimationFrame(
        dibujar
    );

}


/* =====================================================
   INICIAR
===================================================== */

dibujar();


/* =====================================================
   CLICK PARA ENTRAR
===================================================== */

const logo =
    document.getElementById(
        "logo"
    );


let entrando = false;


document.addEventListener(
    "click",
    function() {

        if (
            entrando
        ) {

            return;

        }


        entrando = true;


        /*
           Paramos de aceptar
           nuevas pinceladas.
        */

        document.body.style.cursor =
            "default";


        /*
           Desaparece el salvapantallas.
        */

        canvas.classList.add(
            "salir"
        );


        /*
           Desaparece el logo.
        */

        logo.classList.add(
            "salir"
        );


        /*
           Después de la transición
        */

        setTimeout(
            function() {

                canvas.style.display =
                    "none";

                logo.style.display =
                    "none";

                document.body.style.overflow =
                    "auto";

            },
            1200
        );

    }
);

</script>

</body>
</html>
