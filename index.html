<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #0a0a0a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================================================
   WEB PRINCIPAL
========================================================= */

.pagina {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #3a3a3a 0%, #1d1d1d 45%, #080808 100%);
    position: relative;
    overflow: hidden;
}

/* Textura industrial */

.pagina::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;

    background-image:
        repeating-linear-gradient(
            135deg,
            transparent 0px,
            transparent 7px,
            rgba(255,255,255,0.08) 8px,
            transparent 9px
        );
}

/* =========================================================
   PORTADA
========================================================= */

.hero {
    min-height: 100vh;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;
    z-index: 2;
}

.logo-principal {
    width: min(650px, 75vw);
    max-width: 650px;
    height: auto;

    filter:
        drop-shadow(0 15px 30px rgba(0,0,0,0.7))
        drop-shadow(0 0 20px rgba(255,255,255,0.08));
}

.linea {
    width: min(520px, 65vw);
    height: 1px;

    margin-top: 35px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.7),
        transparent
    );
}

.subtitulo {
    margin-top: 18px;

    font-size: 12px;
    letter-spacing: 7px;
    color: #bcbcbc;
    text-align: center;
}

/* =========================================================
   HIGHLIGHTS
========================================================= */

.highlights {
    min-height: 250vh;
    position: relative;
    z-index: 2;

    padding-top: 15vh;
}

/* Título */

.highlights-title {
    position: sticky;
    top: 12vh;

    height: 25vh;

    display: flex;
    justify-content: center;
    align-items: center;

    pointer-events: none;

    z-index: 5;
}

.highlights-title h2 {
    font-size: clamp(70px, 14vw, 210px);
    font-weight: 900;

    letter-spacing: -8px;

    color: transparent;

    -webkit-text-stroke: 1px rgba(255,255,255,0.55);

    opacity: 0.9;

    transition: transform 0.2s linear;
}

/* Pequeños datos técnicos */

.highlight-info {
    position: absolute;

    left: 5vw;
    top: 47vh;

    z-index: 10;

    font-size: 10px;
    letter-spacing: 4px;

    color: rgba(255,255,255,0.55);

    line-height: 2;
}

.highlight-info span {
    color: white;
}

/* Línea decorativa */

.tech-line {
    position: absolute;

    top: 53vh;
    right: 5vw;

    width: 180px;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.5)
    );
}

/* =========================================================
   VIDEO
========================================================= */

.video-wrapper {
    position: relative;

    width: min(1000px, 82vw);
    aspect-ratio: 16 / 9;

    margin: 10vh auto 0;

    transform:
        translateY(180px)
        scale(0.55);

    opacity: 0;

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 40px 100px rgba(0,0,0,0.8),
        0 0 50px rgba(255,255,255,0.04);

    overflow: hidden;

    background: #050505;

    transition:
        transform 0.15s linear,
        opacity 0.15s linear;
}

/* Marco exterior */

.video-wrapper::before {
    content: "";

    position: absolute;
    inset: -1px;

    border: 1px solid rgba(255,255,255,0.08);

    pointer-events: none;

    z-index: 5;
}

/* Video */

.video-wrapper iframe {
    width: 100%;
    height: 100%;

    border: none;

    display: block;
}

/* Nombre del vídeo */

.video-name {
    position: absolute;

    bottom: 25px;
    left: 30px;

    z-index: 10;

    font-size: 12px;
    letter-spacing: 4px;

    color: white;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
}

/* Número */

.video-number {
    position: absolute;

    top: 25px;
    right: 30px;

    z-index: 10;

    font-size: 11px;
    letter-spacing: 3px;

    color: rgba(255,255,255,0.65);
}

/* =========================================================
   TRANSICIÓN
========================================================= */

.transition-text {
    width: 100%;

    text-align: center;

    margin-top: 35vh;

    font-size: 11px;
    letter-spacing: 6px;

    color: rgba(255,255,255,0.35);

    opacity: 0;

    transform: translateY(30px);

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}

/* =========================================================
   SALVAPANTALLAS
   NO TOCAR
========================================================= */

#niebla {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 9999;

    pointer-events: auto;

    background: transparent;
}

.logo-secundario {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(330px, 55vw);

    z-index: 10000;

    pointer-events: none;

    filter:
        drop-shadow(0 15px 30px rgba(0,0,0,0.5));

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}

.ocultar {
    opacity: 0 !important;

    transform:
        translate(-50%, -50%)
        scale(1.08) !important;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .logo-principal {
        width: 82vw;
    }

    .subtitulo {
        font-size: 9px;
        letter-spacing: 4px;
    }

    .highlights-title h2 {
        letter-spacing: -4px;
    }

    .highlight-info {
        left: 6vw;
        top: 43vh;
    }

    .tech-line {
        right: 6vw;
        width: 100px;
    }

    .video-wrapper {
        width: 92vw;
    }

    .video-name {
        font-size: 9px;
        left: 15px;
        bottom: 15px;
    }

    .video-number {
        right: 15px;
        top: 15px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     WEB PRINCIPAL
===================================================== -->

<main class="pagina">

    <!-- PORTADA -->

    <section class="hero">

        <img
            src="logo-principal.png"
            alt="JOS3"
            class="logo-principal"
        >

        <div class="linea"></div>

        <div class="subtitulo">
            AUTOMOTIVE · PHOTOGRAPHY · LIFESTYLE
        </div>

    </section>


    <!-- =================================================
         HIGHLIGHTS
    ================================================= -->

    <section class="highlights" id="highlights">

        <div class="highlights-title">
            <h2 id="highlightsTitle">
                HIGHLIGHTS
            </h2>
        </div>


        <div class="highlight-info">

            <div>
                PROJECT <span>01</span>
            </div>

            <div>
                CATEGORY <span>AUTOMOTIVE</span>
            </div>

            <div>
                FORMAT <span>16:9</span>
            </div>

        </div>


        <div class="tech-line"></div>


        <!-- VIDEO -->

        <div
            class="video-wrapper"
            id="videoWrapper"
        >

            <iframe
                src="https://www.youtube.com/embed/sMszBMthOQI?rel=0&modestbranding=1"
                title="Probando FA 470cc"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

            <div class="video-name">
                PROBANDO FA 470CC
            </div>

            <div class="video-number">
                HIGHLIGHT / 01
            </div>

        </div>


        <div
            class="transition-text"
            id="transitionText"
        >
            SCROLL TO CONTINUE
        </div>

    </section>

</main>


<!-- =====================================================
     SALVAPANTALLAS
===================================================== -->

<canvas id="niebla"></canvas>

<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo-secundario"
    id="logoSecundario"
>


<script>

/* =========================================================
   SALVAPANTALLAS
   NO TOCAR
========================================================= */

const canvas = document.getElementById("niebla");
const ctx = canvas.getContext("2d");

let brushMarks = [];

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    drawFog();
}

window.addEventListener("resize", resizeCanvas);


function drawFog() {

    ctx.globalCompositeOperation = "source-over";

    const gradient = ctx.createRadialGradient(
        canvas.width / 2,
        canvas.height / 2,
        0,
        canvas.width / 2,
        canvas.height / 2,
        Math.max(canvas.width, canvas.height)
    );

    gradient.addColorStop(0, "#bdbdbd");
    gradient.addColorStop(0.5, "#969696");
    gradient.addColorStop(1, "#707070");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


function addBrushMark(x, y, angle, speed) {

    brushMarks.push({

        x: x,
        y: y,

        angle: angle,

        width:
            Math.min(120, 35 + speed * 0.8),

        height:
            Math.min(55, 20 + speed * 0.35),

        life: 1,

        maxLife:
            600 + Math.random() * 300

    });
}


let lastMouseX = null;
let lastMouseY = null;
let lastMouseTime = performance.now();


window.addEventListener("mousemove", function(e) {

    const now = performance.now();

    if (
        lastMouseX !== null &&
        lastMouseY !== null
    ) {

        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );

        const dt = Math.max(
            now - lastMouseTime,
            1
        );

        const speed = distance / dt * 16;

        if (distance > 2) {

            const angle = Math.atan2(dy, dx);

            const steps =
                Math.max(
                    1,
                    Math.floor(distance / 15)
                );

            for (
                let i = 0;
                i < steps;
                i++
            ) {

                const t = i / steps;

                const px =
                    lastMouseX +
                    dx * t;

                const py =
                    lastMouseY +
                    dy * t;

                const offset =
                    (Math.random() - 0.5) * 25;

                const perpX =
                    -Math.sin(angle) * offset;

                const perpY =
                    Math.cos(angle) * offset;

                addBrushMark(
                    px + perpX,
                    py + perpY,
                    angle,
                    speed
                );
            }
        }
    }

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    lastMouseTime = now;

});


function animateFog(time) {

    drawFog();

    ctx.globalCompositeOperation =
        "destination-out";

    const currentTime = performance.now();

    brushMarks =
        brushMarks.filter(mark => {

            const age =
                currentTime -
                (
                    mark.created ||
                    (mark.created = currentTime)
                );

            mark.life =
                1 -
                age / mark.maxLife;

            if (mark.life <= 0) {
                return false;
            }

            const fade =
                Math.max(
                    0,
                    mark.life
                );

            ctx.save();

            ctx.translate(
                mark.x,
                mark.y
            );

            ctx.rotate(
                mark.angle
            );

            ctx.globalAlpha =
                fade * 0.8;

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                mark.width,
                mark.height,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

            return true;

        });

    requestAnimationFrame(
        animateFog
    );
}


resizeCanvas();

requestAnimationFrame(
    animateFog
);


/* =========================================================
   SALIR DEL SALVAPANTALLAS
========================================================= */

const logoSecundario =
    document.getElementById(
        "logoSecundario"
    );

canvas.addEventListener(
    "click",
    function() {

        canvas.style.transition =
            "opacity 1s ease";

        canvas.style.opacity = "0";

        logoSecundario.classList.add(
            "ocultar"
        );

        setTimeout(
            function() {

                canvas.style.display =
                    "none";

                logoSecundario.style.display =
                    "none";

            },
            1000
        );

    }
);


/* =========================================================
   ANIMACIÓN DEL SCROLL
========================================================= */

const videoWrapper =
    document.getElementById(
        "videoWrapper"
    );

const highlightsTitle =
    document.getElementById(
        "highlightsTitle"
    );

const transitionText =
    document.getElementById(
        "transitionText"
    );


function updateScrollAnimation() {

    const rect =
        videoWrapper.getBoundingClientRect();

    const windowHeight =
        window.innerHeight;


    /*
       PROGRESO DE ENTRADA
    */

    const start =
        windowHeight * 0.95;

    const end =
        windowHeight * 0.20;

    let progress =
        (start - rect.top) /
        (start - end);

    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /*
       ESCALA DEL VÍDEO
    */

    const scale =
        0.55 +
        progress * 0.45;


    const translateY =
        180 -
        progress * 180;


    videoWrapper.style.transform =
        `translateY(${translateY}px) scale(${scale})`;


    videoWrapper.style.opacity =
        progress;


    /*
       MOVIMIENTO DEL TÍTULO
    */

    const titleRect =
        highlightsTitle.getBoundingClientRect();

    const titleProgress =
        Math.max(
            0,
            Math.min(
                1,
                -titleRect.top /
                (windowHeight * 0.7)
            )
        );


    highlightsTitle.style.transform =
        `translateY(${
            titleProgress * -80
        }px)`;


    highlightsTitle.style.opacity =
        1 -
        titleProgress * 0.7;


    /*
       TEXTO FINAL
    */

    if (progress > 0.75) {

        transitionText.style.opacity =
            (progress - 0.75) * 4;

        transitionText.style.transform =
            `translateY(${
                30 -
                (progress - 0.75) * 120
            }px)`;

    } else {

        transitionText.style.opacity =
            0;

        transitionText.style.transform =
            "translateY(30px)";
    }

}


window.addEventListener(
    "scroll",
    updateScrollAnimation
);

window.addEventListener(
    "resize",
    updateScrollAnimation
);

updateScrollAnimation();

</script>

</body>
</html>
