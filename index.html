<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOS3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   PÁGINA REAL
========================= */

.pagina {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 40%, #eeeeee 0%, #cfcfcf 45%, #a9a9a9 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #111;
}

.contenido {
    text-align: center;
}

.contenido h1 {
    font-size: clamp(90px, 18vw, 260px);
    font-weight: 900;
    letter-spacing: -15px;
}

.contenido p {
    margin-top: 15px;
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.55;
}


/* =========================
   CAPA DE ENTRADA
========================= */

.entrada {
    position: fixed;
    inset: 0;
    z-index: 10;

    background:
        radial-gradient(
            circle at center,
            rgba(245,245,245,0.97),
            rgba(215,215,215,0.98)
        );

    overflow: hidden;

    /* Máscara que crea la "nube" */
    -webkit-mask-image:
        radial-gradient(
            ellipse 55px 42px at var(--mouse-x) var(--mouse-y),
            transparent 0%,
            transparent 30%,
            rgba(0,0,0,0.35) 48%,
            rgba(0,0,0,0.85) 72%,
            black 100%
        );

    mask-image:
        radial-gradient(
            ellipse 55px 42px at var(--mouse-x) var(--mouse-y),
            transparent 0%,
            transparent 30%,
            rgba(0,0,0,0.35) 48%,
            rgba(0,0,0,0.85) 72%,
            black 100%
        );

    transition: opacity 0.4s ease;
}


/* =========================
   ESTELA
========================= */

.estela {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 11;

    opacity: 0.9;

    background:
        radial-gradient(
            ellipse 85px 55px at var(--trail-x1) var(--trail-y1),
            rgba(255,255,255,0.18),
            transparent 70%
        ),

        radial-gradient(
            ellipse 130px 65px at var(--trail-x2) var(--trail-y2),
            rgba(255,255,255,0.12),
            transparent 75%
        ),

        radial-gradient(
            ellipse 180px 75px at var(--trail-x3) var(--trail-y3),
            rgba(255,255,255,0.08),
            transparent 80%
        );

    filter: blur(12px);
}


/* =========================
   LOGO
========================= */

.logo {
    position: fixed;
    z-index: 20;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(270px, 42vw);

    pointer-events: none;

    filter:
        drop-shadow(0 10px 20px rgba(0,0,0,0.18));
}


/* =========================
   CLICK / TRANSICIÓN
========================= */

.entrada.expandir {
    -webkit-mask-image:
        radial-gradient(
            circle 150vmax at var(--mouse-x) var(--mouse-y),
            transparent 0%,
            transparent 100%
        );

    mask-image:
        radial-gradient(
            circle 150vmax at var(--mouse-x) var(--mouse-y),
            transparent 0%,
            transparent 100%
        );

    transition:
        -webkit-mask-image 1.2s ease,
        mask-image 1.2s ease;
}

.logo.desaparecer {
    opacity: 0;
    transform:
        translate(-50%, -50%)
        scale(1.25);

    transition:
        opacity 0.5s ease,
        transform 0.8s ease;
}

.estela.ocultar {
    opacity: 0;
    transition: opacity 0.5s ease;
}


/* =========================
   MÓVIL
========================= */

@media (max-width: 700px) {

    .logo {
        width: 55vw;
    }

    .entrada {
        -webkit-mask-image:
            radial-gradient(
                ellipse 45px 35px at var(--mouse-x) var(--mouse-y),
                transparent 0%,
                transparent 30%,
                rgba(0,0,0,0.4) 50%,
                black 100%
            );

        mask-image:
            radial-gradient(
                ellipse 45px 35px at var(--mouse-x) var(--mouse-y),
                transparent 0%,
                transparent 30%,
                rgba(0,0,0,0.4) 50%,
                black 100%
            );
    }
}
</style>
</head>


<body>

<!-- =========================
     PÁGINA REAL
========================= -->

<div class="pagina">

    <div class="contenido">
        <h1>JOS3</h1>
        <p>Página personal</p>
    </div>

</div>


<!-- =========================
     CAPA DE NIEBLA
========================= -->

<div class="entrada" id="entrada"></div>

<!-- Estela -->
<div class="estela" id="estela"></div>


<!-- LOGO -->
<img
    src="logo-secundario.png"
    alt="JOS3"
    class="logo"
    id="logo"
>


<script>

const entrada = document.getElementById("entrada");
const estela = document.getElementById("estela");
const logo = document.getElementById("logo");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let trail = [
    { x: mouseX, y: mouseY },
    { x: mouseX, y: mouseY },
    { x: mouseX, y: mouseY }
];

let activo = true;


/* =========================
   MOVIMIENTO DEL RATÓN
========================= */

document.addEventListener("mousemove", (e) => {

    mouseX = e.clientX;
    mouseY = e.clientY;

});


/* =========================
   ANIMACIÓN SUAVE
========================= */

function animar() {

    if (!activo) return;

    /*
       El punto principal sigue al ratón
       rápidamente.
    */

    trail[0].x += (mouseX - trail[0].x) * 0.22;
    trail[0].y += (mouseY - trail[0].y) * 0.22;


    /*
       Estos puntos siguen al anterior
       más lentamente, creando la estela.
    */

    trail[1].x += (trail[0].x - trail[1].x) * 0.12;
    trail[1].y += (trail[0].y - trail[1].y) * 0.12;

    trail[2].x += (trail[1].x - trail[2].x) * 0.08;
    trail[2].y += (trail[1].y - trail[2].y) * 0.08;


    /*
       Posición de la zona transparente.
    */

    entrada.style.setProperty(
        "--mouse-x",
        trail[0].x + "px"
    );

    entrada.style.setProperty(
        "--mouse-y",
        trail[0].y + "px"
    );


    /*
       Posiciones de la nube/estela.
    */

    estela.style.setProperty(
        "--trail-x1",
        trail[0].x + "px"
    );

    estela.style.setProperty(
        "--trail-y1",
        trail[0].y + "px"
    );

    estela.style.setProperty(
        "--trail-x2",
        trail[1].x + "px"
    );

    estela.style.setProperty(
        "--trail-y2",
        trail[1].y + "px"
    );

    estela.style.setProperty(
        "--trail-x3",
        trail[2].x + "px"
    );

    estela.style.setProperty(
        "--trail-y3",
        trail[2].y + "px"
    );


    requestAnimationFrame(animar);
}

animar();


/* =========================
   CLICK
========================= */

document.addEventListener("click", () => {

    if (!activo) return;

    activo = false;

    entrada.classList.add("expandir");
    logo.classList.add("desaparecer");
    estela.classList.add("ocultar");

    setTimeout(() => {

        entrada.style.display = "none";
        estela.style.display = "none";
        logo.style.display = "none";

        document.body.style.overflow = "auto";

    }, 1300);

});

</script>

</body>
</html>
