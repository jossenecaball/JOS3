<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOS3</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    background: #080808;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   WEB PRINCIPAL
========================================================= */

.pagina {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #3a3a3a 0%,
            #252525 32%,
            #111111 68%,
            #080808 100%
        );

    position: relative;
    z-index: 1;
}

.pagina::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 8px
        );

    pointer-events: none;
    z-index: 0;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
    z-index: 2;

    padding: 60px 20px;
}

.hero-logo {
    width: min(700px, 82vw);
    height: auto;

    display: block;

    filter:
        drop-shadow(0 12px 30px rgba(0,0,0,0.6));

    user-select: none;
    pointer-events: none;
}

.hero-line {
    width: min(600px, 75vw);
    height: 1px;

    margin-top: 35px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.7),
            transparent
        );
}

.hero-subtitle {
    margin-top: 18px;

    font-size: 12px;
    letter-spacing: 5px;

    color: rgba(255,255,255,0.62);

    font-weight: 500;
}


/* =========================================================
   HIGHLIGHTS
========================================================= */

.highlights {
    position: relative;
    z-index: 2;

    padding: 150px 0 220px;

    overflow: hidden;
}

.section-title {
    text-align: center;

    font-size: clamp(42px, 7vw, 100px);
    font-weight: 900;

    letter-spacing: -4px;

    margin-bottom: 25px;
}

.section-description {
    max-width: 650px;

    margin: 0 auto 130px;

    padding: 0 25px;

    text-align: center;

    color: rgba(255,255,255,0.55);

    line-height: 1.7;

    font-size: 15px;
}


/* =========================================================
   FA 470CC
========================================================= */

.highlight {
    position: relative;

    min-height: 1700px;

    padding: 0 20px;
}

.highlight-info {
    width: min(900px, 90vw);

    margin: 0 auto 80px;

    text-align: center;
}

.highlight-number {
    font-size: 12px;

    letter-spacing: 5px;

    color: rgba(255,255,255,0.4);

    margin-bottom: 15px;
}

.highlight-title {
    font-size: clamp(45px, 8vw, 110px);

    font-weight: 900;

    letter-spacing: -5px;

    line-height: 0.9;
}

.highlight-subtitle {
    margin-top: 25px;

    color: rgba(255,255,255,0.55);

    letter-spacing: 3px;

    font-size: 12px;
}


/* =========================================================
   VIDEO VERTICAL
========================================================= */

.vertical-video-wrap {
    width: min(380px, 75vw);

    margin: 0 auto;

    position: relative;

    perspective: 1200px;
}

.vertical-video {
    width: 100%;
    height: auto;

    display: block;

    border-radius: 4px;

    background: #000;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.7);

    transform:
        translate3d(0, 80px, 0)
        scale(0.82)
        rotateX(12deg);

    opacity: 0;

    transition:
        transform 1s cubic-bezier(.16,1,.3,1),
        opacity 0.8s ease;

    will-change: transform, opacity;
}

.vertical-video.active {
    transform:
        translate3d(0, 0, 0)
        scale(1)
        rotateX(0deg);

    opacity: 1;
}


/* =========================================================
   MACHINE TEXT
========================================================= */

.machine-text {
    width: min(1000px, 90vw);

    margin: 170px auto;

    text-align: center;

    opacity: 0;
    transform: translateY(60px);

    transition:
        opacity 0.9s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

.machine-text.active {
    opacity: 1;
    transform: translateY(0);
}

.machine-small {
    font-size: 11px;

    letter-spacing: 5px;

    color: rgba(255,255,255,0.4);

    margin-bottom: 20px;
}

.machine-big {
    font-size: clamp(50px, 9vw, 130px);

    font-weight: 900;

    letter-spacing: -6px;

    line-height: 0.85;
}


/* =========================================================
   YOUTUBE
========================================================= */

.youtube-wrap {
    width: min(1100px, 92vw);

    margin: 0 auto;

    opacity: 0;

    transform: translateY(80px);

    transition:
        opacity 1s ease,
        transform 1.1s cubic-bezier(.16,1,.3,1);
}

.youtube-wrap.active {
    opacity: 1;

    transform: translateY(0);
}

.youtube-title {
    margin-bottom: 25px;

    font-size: 12px;

    letter-spacing: 4px;

    color: rgba(255,255,255,0.45);

    text-align: center;
}

.youtube-frame {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.7);
}

.youtube-frame iframe {
    width: 100%;
    height: 100%;

    border: 0;
}


/* =========================================================
   SCREENSAVER
========================================================= */

#screensaver {
    position: fixed;

    inset: 0;

    z-index: 9999;

    /*
        IMPORTANTE:
        La capa es translúcida.
        La web queda debajo y el canvas funciona
        como máscara/revelado.
    */

    background: rgba(145,145,145,0.94);

    cursor: none;

    overflow: hidden;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

#screensaver.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =========================================================
   CANVAS DE REVELADO
========================================================= */

#niebla {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    /*
        El canvas contiene únicamente la máscara gris.
        La transparencia se consigue eliminando partes
        de esta máscara.
    */

    pointer-events: none;
}


/* =========================================================
   LOGO SECUNDARIO
========================================================= */

.screensaver-logo {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(330px, 45vw);

    transform: translate(-50%, -50%);

    z-index: 2;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(0 15px 30px rgba(0,0,0,0.35));
}

.screensaver-hint {
    position: absolute;

    bottom: 45px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 3;

    font-size: 10px;

    letter-spacing: 4px;

    color: rgba(255,255,255,0.45);

    pointer-events: none;

    white-space: nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .hero {
        min-height: 90vh;
    }

    .hero-subtitle {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .highlights {
        padding-top: 100px;
    }

    .section-description {
        margin-bottom: 90px;
    }

    .highlight {
        min-height: 1450px;
    }

    .machine-text {
        margin: 120px auto;
    }

    .screensaver-logo {
        width: 55vw;
    }

    .screensaver-hint {
        bottom: 30px;

        font-size: 8px;

        letter-spacing: 3px;
    }
}
</style>
</head>


<body>


<!-- =======================================================
     WEB PRINCIPAL
======================================================== -->

<main class="pagina">


    <!-- HERO -->

    <section class="hero">

        <img
            src="logo-principal.png"
            class="hero-logo"
            alt="JOS3"
        >

        <div class="hero-line"></div>

        <div class="hero-subtitle">
            AUTOMOTIVE · PHOTOGRAPHY · LIFESTYLE
        </div>

    </section>



    <!-- HIGHLIGHTS -->

    <section class="highlights">

        <h2 class="section-title">
            HIGHLIGHTS
        </h2>

        <p class="section-description">
            Máquinas, experiencias y momentos que merecen ser recordados.
            Cada proyecto tiene su propia historia.
        </p>



        <!-- FA 470CC -->

        <article class="highlight">

            <div class="highlight-info">

                <div class="highlight-number">
                    01 / MACHINE
                </div>

                <h3 class="highlight-title">
                    FA 470CC
                </h3>

                <div class="highlight-subtitle">
                    PROBANDO UNA MÁQUINA DIFERENTE
                </div>

            </div>



            <!-- VIDEO VERTICAL -->

            <div class="vertical-video-wrap">

                <video
                    id="faVideo"
                    class="vertical-video"
                    src="fa470-vertical.mp4"
                    muted
                    loop
                    playsinline
                    preload="metadata"
                ></video>

            </div>



            <!-- TEXTO -->

            <div
                id="machineText"
                class="machine-text"
            >

                <div class="machine-small">
                    THE MACHINE
                </div>

                <div class="machine-big">
                    FA 470CC
                </div>

            </div>



            <!-- YOUTUBE -->

            <div
                id="youtubeBlock"
                class="youtube-wrap"
            >

                <div class="youtube-title">
                    FULL VIDEO
                </div>

                <div class="youtube-frame">

                    <iframe
                        src="https://www.youtube.com/embed/sMszBMthOQI?rel=0&modestbranding=1"
                        title="PROBANDO FA 470CC"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen
                    ></iframe>

                </div>

            </div>

        </article>

    </section>

</main>



<!-- =======================================================
     SCREENSAVER
======================================================== -->

<div id="screensaver">

    <canvas id="niebla"></canvas>

    <img
        src="logo-secundario.png"
        class="screensaver-logo"
        alt="J3"
    >

    <div class="screensaver-hint">
        MOVE TO EXPLORE · CLICK TO ENTER
    </div>

</div>



<script>

/* =========================================================
   RECARGA SIEMPRE ARRIBA
========================================================= */

history.scrollRestoration = "manual";

window.addEventListener("load", () => {
    window.scrollTo(0, 0);
});

window.addEventListener("pageshow", () => {
    window.scrollTo(0, 0);
});


/* =========================================================
   SCREENSAVER
   REVELADO CONTINUO Y TRANSPARENTE
========================================================= */

const screensaver =
    document.getElementById("screensaver");

const canvas =
    document.getElementById("niebla");

const ctx =
    canvas.getContext("2d", {
        alpha: true
    });


let width = 0;
let height = 0;
let dpr = 1;

let mouseX = -1000;
let mouseY = -1000;

let previousX = -1000;
let previousY = -1000;

let lastMoveTime = 0;

let animationFrame = null;


/* =========================================================
   TRAIL
========================================================= */

/*
    Una sola trayectoria continua.

    No usamos:
    - óvalos
    - círculos
    - stamps
    - partículas

    El pincel se construye como una curva continua.
*/

const trail = [];

const TRAIL_LIFE = 760;

const MIN_DISTANCE = 2;

const MAX_POINTS = 120;

const BRUSH_WIDTH = 130;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(width * dpr);

    canvas.height =
        Math.floor(height * dpr);

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas,
    { passive: true }
);

resizeCanvas();


/* =========================================================
   RATÓN
========================================================= */

window.addEventListener(
    "mousemove",
    (event) => {

        const x =
            event.clientX;

        const y =
            event.clientY;

        const now =
            performance.now();


        /*
            Si hemos estado quietos demasiado tiempo,
            empezamos una nueva trayectoria.
        */

        if (
            previousX < 0 ||
            previousY < 0 ||
            now - lastMoveTime > TRAIL_LIFE
        ) {

            trail.length = 0;

            previousX = x;
            previousY = y;

            lastMoveTime = now;

            return;
        }


        const dx =
            x - previousX;

        const dy =
            y - previousY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance < MIN_DISTANCE) {
            return;
        }


        /*
            Interpolación continua.

            Evita huecos cuando el ratón se mueve
            rápidamente.
        */

        const steps =
            Math.max(
                1,
                Math.ceil(distance / 6)
            );


        for (
            let i = 1;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            trail.push({
                x:
                    previousX +
                    dx * t,

                y:
                    previousY +
                    dy * t,

                time: now
            });
        }


        if (
            trail.length >
            MAX_POINTS
        ) {

            trail.splice(
                0,
                trail.length -
                MAX_POINTS
            );
        }


        previousX = x;
        previousY = y;

        lastMoveTime = now;
    },
    {
        passive: true
    }
);


/* =========================================================
   SALIR DE PANTALLA
========================================================= */

window.addEventListener(
    "mouseout",
    (event) => {

        if (!event.relatedTarget) {

            previousX = -1000;
            previousY = -1000;
        }
    },
    {
        passive: true
    }
);


/* =========================================================
   CURVA SUAVE
========================================================= */

function buildSmoothPath(points) {

    if (points.length < 2) {
        return false;
    }


    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length - 1;
        i++
    ) {

        const current =
            points[i];

        const next =
            points[i + 1];


        const midX =
            (current.x +
             next.x) / 2;

        const midY =
            (current.y +
             next.y) / 2;


        ctx.quadraticCurveTo(
            current.x,
            current.y,
            midX,
            midY
        );
    }


    const last =
        points[points.length - 1];

    const previous =
        points[points.length - 2];


    ctx.quadraticCurveTo(
        previous.x,
        previous.y,
        last.x,
        last.y
    );


    return true;
}


/* =========================================================
   DIBUJAR TRAZO
========================================================= */

function drawTrail(now) {

    /*
        Eliminamos puntos caducados.
    */

    while (
        trail.length &&
        now - trail[0].time >
        TRAIL_LIFE
    ) {

        trail.shift();
    }


    if (trail.length < 2) {
        return;
    }


    /*
        -----------------------------------------------------
        TRAZO PRINCIPAL
        -----------------------------------------------------

        destination-out elimina la capa gris
        y deja ver directamente la web inferior.
    */

    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.filter =
        "blur(28px)";

    ctx.globalAlpha =
        0.92;

    ctx.lineWidth =
        BRUSH_WIDTH;


    buildSmoothPath(trail);

    ctx.stroke();

    ctx.restore();


    /*
        -----------------------------------------------------
        HALO DEL PINCEL
        -----------------------------------------------------

        Una segunda pasada muy suave.
        No son formas independientes:
        sigue exactamente el mismo trazo.
    */

    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.filter =
        "blur(55px)";

    ctx.globalAlpha =
        0.42;

    ctx.lineWidth =
        BRUSH_WIDTH * 1.35;


    buildSmoothPath(trail);

    ctx.stroke();

    ctx.restore();


    /*
        -----------------------------------------------------
        EXTREMO DEL TRAZO
        -----------------------------------------------------

        El extremo reciente queda ligeramente
        más transparente y suave.
    */

    const last =
        trail[trail.length - 1];

    const age =
        now - last.time;


    const endFade =
        Math.max(
            0,
            1 - age / TRAIL_LIFE
        );


    ctx.save();

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.lineCap =
        "round";

    ctx.filter =
        "blur(35px)";

    ctx.globalAlpha =
        endFade * 0.35;

    ctx.lineWidth =
        BRUSH_WIDTH * 0.85;


    ctx.beginPath();

    ctx.moveTo(
        last.x,
        last.y
    );

    ctx.lineTo(
        last.x,
        last.y
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   MÁSCARA GRIS
========================================================= */

function drawFog() {

    /*
        MUY IMPORTANTE:

        Cada frame reconstruimos la capa gris.
        Al ser semitransparente, la página de debajo
        sigue siendo la fuente del efecto visual.

        El trazo destination-out elimina partes
        de esta capa.
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    gradient.addColorStop(
        0,
        "rgba(190,190,190,0.96)"
    );

    gradient.addColorStop(
        0.5,
        "rgba(150,150,150,0.94)"
    );

    gradient.addColorStop(
        1,
        "rgba(115,115,115,0.96)"
    );


    ctx.globalCompositeOperation =
        "source-over";

    ctx.globalAlpha = 1;

    ctx.filter = "none";

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   LOOP
========================================================= */

function renderScreensaver(now) {

    drawFog();

    drawTrail(now);

    animationFrame =
        requestAnimationFrame(
            renderScreensaver
        );
}


animationFrame =
    requestAnimationFrame(
        renderScreensaver
    );


/* =========================================================
   ENTRAR EN LA WEB
========================================================= */

screensaver.addEventListener(
    "click",
    () => {

        screensaver.classList.add(
            "hidden"
        );


        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );

            animationFrame = null;
        }


        canvas.style.display =
            "none";

        document.body.style.cursor =
            "auto";
    }
);


/* =========================================================
   HIGHLIGHTS — ANIMACIONES
========================================================= */

const faVideo =
    document.getElementById("faVideo");

const machineText =
    document.getElementById("machineText");

const youtubeBlock =
    document.getElementById("youtubeBlock");


let highlightTicking =
    false;


/* =========================================================
   SCROLL HIGHLIGHTS
========================================================= */

function updateHighlights() {

    const viewportCenter =
        window.innerHeight / 2;


    /*
        VIDEO VERTICAL
    */

    const videoRect =
        faVideo.getBoundingClientRect();

    const videoCenter =
        videoRect.top +
        videoRect.height / 2;

    const distance =
        Math.abs(
            videoCenter -
            viewportCenter
        );

    const videoIsCentered =
        distance <
        window.innerHeight * 0.24;


    if (videoIsCentered) {

        faVideo.classList.add(
            "active"
        );


        if (faVideo.paused) {

            faVideo.play()
                .catch(() => {});
        }

    } else {

        faVideo.classList.remove(
            "active"
        );


        if (!faVideo.paused) {

            faVideo.pause();
        }
    }


    /*
        TEXTO
    */

    const textRect =
        machineText.getBoundingClientRect();

    const textCenter =
        textRect.top +
        textRect.height / 2;

    const textVisible =
        Math.abs(
            textCenter -
            viewportCenter
        ) <
        window.innerHeight * 0.45;


    if (textVisible) {

        machineText.classList.add(
            "active"
        );

    } else {

        machineText.classList.remove(
            "active"
        );
    }


    /*
        YOUTUBE
    */

    const youtubeRect =
        youtubeBlock.getBoundingClientRect();

    const youtubeCenter =
        youtubeRect.top +
        youtubeRect.height / 2;

    const youtubeVisible =
        youtubeCenter <
        window.innerHeight * 1.1 &&
        youtubeCenter >
        -window.innerHeight * 0.2;


    if (youtubeVisible) {

        youtubeBlock.classList.add(
            "active"
        );

    } else {

        youtubeBlock.classList.remove(
            "active"
        );
    }


    highlightTicking =
        false;
}


/* =========================================================
   SCROLL OPTIMIZADO
========================================================= */

window.addEventListener(
    "scroll",
    () => {

        if (!highlightTicking) {

            highlightTicking = true;

            requestAnimationFrame(
                updateHighlights
            );
        }
    },
    {
        passive: true
    }
);


/* =========================================================
   PRIMERA ACTUALIZACIÓN
========================================================= */

updateHighlights();


/* =========================================================
   LIMPIEZA
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );
        }
    }
);

</script>

</body>
</html>
